[package]
name = "pixelsweep"
version = "1.3.0"
description = "Apple-style frosted glass disk cleaner with Stardew-inspired pixel animations and local music player"
authors = ["Candies"]
edition = "2021"

[lib]
name = "pixelsweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
dirs = "5"
sysinfo = "0.31"
window-vibrancy = "0.5"
