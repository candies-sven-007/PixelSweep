name: Build & Release PixelSweep (Windows + macOS Universal)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact_name: "PixelSweep-Windows-Installers"
            artifact_path: "src-tauri/target/release/bundle/**"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            artifact_name: "PixelSweep-macOS-Universal-Installers"
            artifact_path: "src-tauri/target/universal-apple-darwin/release/bundle/**"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri installers and attach to Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          releaseName: "PixelSweep ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          releaseBody: |
            ## PixelSweep 安装包发布（Windows + macOS 通用版）
            - **Windows**: 下载 `.exe`（NSIS 安装包）或 `.msi` 安装包直接安装。
            - **macOS (Apple Silicon + Intel 通用)**: 下载 `universal.dmg` 拖入「应用程序」文件夹。
            - **首次打开未签名软件提示处理**:
              - macOS 终端执行：`xattr -cr /Applications/PixelSweep.app`
              - Windows SmartScreen 提示时点击「更多信息 -> 仍要运行」
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts to Actions run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
